rder-color:#c9d5e2}.num{font:500 13px monospace;color:#76879c}.card h3{margin:12px 0}.tag{font-size:12px;background:#eef2f6;border-radius:20px;padding:5px 10px;display:inline-block}.tag.ready{background:#fff0be;color:#665018}.card a{margin-top:14px}.arrow{float:right}.strip{margin-top:35px;background:#faf6e9;padding:25px 30px;border-radius:12px;display:flex;justify-content:space-between;gap:30px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tabs button[aria-selected=true]{background:var(--navy);color:white}.panel{border:1px solid var(--line);border-radius:14px;padding:30px;margin-bottom:25px}.stepbar{display:flex;gap:7px;margin:15px 0}.stepbar span{height:5px;background:#e7ecf1;flex:1}.stepbar .done{background:var(--gold)}.options{display:grid;gap:10px;margin:20px 0}.options button{text-align:left;font-weight:500}.feedback{padding:13px 16px;background:#f4f7fa;margin-top:16px;border-radius:8px;min-height:50px}.success{color:#176849}.error{color:#a43e29}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.runners{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.runner{border:1px solid var(--line);border-radius:10px;overflow:hidden}.runner h3{padding:15px;margin:0;background:#f2f5f8}.runner .inside{padding:14px}textarea.code{background:#14283f;color:#eff5fd;font:14px/1.6 monospace;width:100%;min-height:220px;resize:vertical;padding:14px;border:0;border-radius:7px;tab-size:4}textarea.stdin{width:100%;height:70px;border:1px solid var(--line);border-radius:7px;padding:8px;font:14px monospace}pre.output{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4f8;min-height:70px;padding:12px;font-size:14px}label{display:block;font-size:13px;margin:12px 0 5px}progress{width:100%;accent-color:#d9aa20}.tokens{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.token{background:#fff6d5}.drop{border:2px dashed #bac8d9;padding:20px;border-radius:10px;min-height:100px;margin:12px 0}.token.chosen{outline:3px solid #c4981a}.path{background:#f3f6fa;padding:18px;border-left:4px solid var(--gold);margin:20px 0;font-weight:650}.small{font-size:14px}.hidden{display:none!important}footer{border-top:1px solid var(--line);padding:25px;color:#657284;font-size:13px;text-align:center}details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:650}@media(max-width:760px){.hero{grid-template-columns:1fr;gap:0;padding-top:5px}.hero img{max-height:230px;grid-row:2}.grid,.runners{grid-template-columns:1fr}h1{letter-spacing:-1.5px}.strip{display:block}header{font-size:13px;padding:15px}.panel{padding:20px}main{padding:25px 18px}.sectionhead{display:block}}
</style><header><a class="brand" href="../index.html"><span class="mark">&lt;/&gt;</span>Технології програмування</a><a href="../index.html#course">Карта курсу ↗</a></header><main id="app"></main><div style="text-align:center;margin:25px"><a class="btn primary" href="../lesson-02/index.html">Наступна тема: Шлях програмного коду →</a></div><footer>Авторка курсу — Людмила Булигіна · C++ / Python / JavaScript</footer><script>
const titles=['Мови і парадигми програмування','Шлях програмного коду','Діалог з користувачем','Типи даних','Від тестування коду до професії','Повторення важливі','Перевіримо функціонал','Символи і рядки','Структури даних','Алгоритми'];
const $=s=>document.querySelector(s);const app=$('#app');let step=0,tab='quest',passed=false;let saved={};try{saved=JSON.parse(localStorage.getItem('tech-progress')||'{}')}catch{}function persist(){try{localStorage.setItem('tech-progress',JSON.stringify(saved))}catch{}}const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">Профільний курс · 10 тем</div><h1>Три мови.<br>Спільна логіка.</h1><p class="lead">Зрозумійте принципи програмування й навчіться бачити їх у різному коді. Від першої команди — до усвідомленого вибору інструментів.</p><div class="languages"><span>C++</span><span> / </span><span>Python</span><span> / </span><span>JavaScript</span></div><a class="btn primary" href="#lesson-1">Почати навчання →</a></div><img src="../hero.png" alt="Ноутбук із кодом і поєднані блоки алгоритму в синіх та золотистих кольорах"></section><section id="course"><div class="sectionhead"><h2>Ваш маршрут</h2><span class="muted small">01 / 10 тем доступно</span></div><div class="grid">${titles.map((t,i)=>`<article class="card ${i===0?'active':''}"><span class="num">ТЕМА ${String(i+1).padStart(2,'0')}</span><span class="arrow">${i===0?'↗':'○'}</span><h3>${t}</h3><span class="tag ${i===0?'ready':''}">${i===0?(saved.quest?'Квест пройдено':'Доступна для навчання'):'Інтерактиви готуються'}</span>${i===0?'<br><a class="btn primary" href="#lesson-1">Відкрити тему →</a>':''}</article>`).join('')}</div></section><div class="strip"><strong>Навчайтеся частинками</strong><span>Пройти тему → Дізнатися більше → Перевірити себе</span></div>`;}
const steps=[{title:'Інструменти розробника',text:'Мова задає правила запису програми. Редактор допомагає писати код; IDE поєднує редактор, засоби запуску й налагодження та інші інструменти. Компілятор або інтерпретатор може працювати і без IDE.',q:'Ви змінили IDE. Чи обов’язково зміниться мова вашої програми?',opts:['Так, кожна IDE має свою мову','Ні, одна мова може використовуватися в різних середовищах'],answer:1,why:'IDE — інструмент роботи. Мова та середовище розробки — різні поняття.'},{title:'Високий і низький рівень',text:'Високорівневі мови приховують багато деталей апаратури. C++, Python і JavaScript — високорівневі мови, хоча рівень абстракції різниться. Мова асемблера пов’язана з конкретною архітектурою; асемблер — програма, яка перекладає її інструкції.',q:'Що правильно названо програмою-перекладачем?',opts:['Мова асемблера','Асемблер'],answer:1,why:'Не плутайте мову асемблера з інструментом її перекладу.'},{title:'Як чи що?',text:'Імперативний підхід описує кроки та зміни стану. Декларативний описує потрібний результат або умови. Наприклад, цикл, що відбирає дорослих користувачів, задає кроки; запит SQL із WHERE age >= 18 задає умову відбору.',q:'SELECT name FROM users WHERE age >= 18 — який підхід ілюструє цей запит?',opts:['Імперативний','Декларативний'],answer:1,why:'Запит описує потрібні дані. Спосіб їх отримання обирає система керування базою даних.'},{title:'Парадигми можна поєднувати',text:'Структурний підхід організовує керування через послідовність, розгалуження й цикли. ООП об’єднує дані та поведінку в об’єктах. Функціональний стиль спирається на композицію функцій і зменшує зміни стану. Логічний — на факти й правила. C++, Python і JavaScript підтримують кілька підходів.',q:'У Python є функції. Чи означає це, що будь-яка Python-програма є функціональною?',opts:['Так, достатньо оголосити функцію','Ні, важливий спосіб організації обчислень'],answer:1,why:'Наявність функцій сама по собі не визначає парадигму програми.'},{title:'Hello, World — спільний експеримент',text:'Коротка програма привітання перевіряє весь шлях: запис коду, запуск та виведення. Традицію популяризувала книжка The C Programming Language (1978). Нижче порівняйте однакову дію трьома мовами.',q:'Що перевіряє успішний запуск Hello, World?',opts:['Що середовище може виконати цю просту програму й показати результат','Що будь-яка наступна програма не матиме помилок'],answer:0,why:'Це перша перевірка працездатності середовища, а не доказ правильності всіх програм.'},{title:'Чому з’являються нові мови?',text:'Мови розвиваються разом із задачами: Fortran — наукові обчислення (1957), C — системне програмування (1972), C++ — розвиток ідей C та абстракцій (1980-ті), Python — читабельність і універсальність (1991), JavaScript — взаємодія у вебі (1995). Старі мови можуть залишатися корисними десятиліттями.',q:'Команда обирає мову для проєкту. Який аргумент найсильніший?',opts:['Вона найновіша','Вона пасує до задачі, платформи, бібліотек і досвіду команди'],answer:1,why:'Вибір мови залежить від контексту. Один рейтинг не визначає найкращий інструмент.'},{title:'Як створюють мову',text:'У типовому інструменті обробки мови лексичний аналіз виділяє токени, синтаксичний — будує структуру, а семантичний перевіряє зміст. Далі можливі генерація іншого коду або виконання. Навчальна мова може перекладатися, наприклад, у JavaScript; це лише один можливий шлях.',q:'Парсер побудував дерево програми. Чи означає це, що програма вже виконана?',opts:['Так','Ні, аналіз структури та виконання — різні етапи'],answer:1,why:'Коректна структура ще не гарантує правильного змісту або успішного виконання.'}];
function lesson(){app.innerHTML=`<a href="../index.html" class="small muted">← Головна курсу</a><div class="eyebrow" style="margin-top:30px">Тема 01</div><h1 style="font-size:clamp(32px,4vw,52px)">Мови і парадигми<br>програмування</h1><p class="lead">Від інструментів розробника — до розуміння того, як код стає дією.</p><div class="tabs" role="tablist">${[['quest','01 · Пройти тему'],['more','02 · Дізнатися більше'],['test','03 · Перевірити себе']].map(([id,t])=>`<button role="tab" aria-selected="${tab===id}" onclick="setTab('${id}')">${t}</button>`).join('')}</div><div id="content"></div>`;renderTab()}
function setTab(t){tab=t;lesson()}function renderTab(){if(tab==='quest')quest();if(tab==='more')more();if(tab==='test')test()}
function quest(){const s=steps[step];passed=false;$('#content').innerHTML=`<div class="panel"><span class="num">КРОК ${step+1} З ${steps.length}</span><div class="stepbar">${steps.map((_,i)=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div><h2>${s.title}</h2><p>${s.text}</p><h3>${s.q}</h3><div class="options">${s.opts.map((o,i)=>`<button onclick="answer(${i})">${o}</button>`).join('')}</div><div id="feedback" role="status"></div><div class="row" style="margin-top:20px"><button onclick="move(-1)" ${step===0?'disabled':''}>← Назад</button><button id="next" class="gold" onclick="move(1)" disabled>${step===steps.length-1?'Завершити квест ✓':'Далі →'}</button></div></div>${step===4?runnerHTML():''}`;if(step===4)initRunners()}
function answer(i){passed=i===steps[step].answer;$('#feedback').className='feedback '+(passed?'success':'error');$('#feedback').textContent=(passed?'✓ Правильно. ':'Спробуйте ще. ')+steps[step].why;$('#next').disabled=!passed}function move(n){if(n>0&&!passed)return;if(step+n>=steps.length){saved.quest=true;persist();$('#content').innerHTML='<div class="panel"><h2>Квест пройдено ✓</h2><p>Ви розрізняєте мову, інструменти й парадигми. Тепер дослідіть шлях виконання коду.</p><button class="gold" onclick="setTab(\'more\')">Дізнатися більше →</button></div>';return}step+=n;quest()}
function more(){$('#content').innerHTML=`<div class="panel"><span class="eyebrow">За запитом учениці</span><h2>Що відбувається після Run?</h2><p><b>Компілятор</b> перекладає програму в інше подання: машинний код, байткод або іншу мову. <b>Інтерпретатор</b> виконує програму чи її проміжне подання. <b>Асемблер</b> перекладає інструкції мови асемблера в машинний код, зазвичай у складі об’єктного файла.</p><div class="row">${['C++','CPython','JavaScript','Асемблер'].map(t=>`<button onclick="showPath('${t}')">${t}</button>`).join('')}</div><div id="path" class="path" aria-live="polite"></div><p class="small muted">Це навчальні схеми типових реалізацій. Мова не прив’язана назавжди до одного способу виконання. Компіляція та інтерпретація можуть поєднуватися.</p><details><summary>Чому інтерпретатор — не просто «рядок за рядком»?</summary><p>Інтерпретатор може спочатку проаналізувати всю програму, а потім виконувати дерево чи байткод. Наприклад, синтаксична помилка наприкінці Python-файла може зупинити запуск до першого print().</p></details><details><summary>JIT: компіляція під час виконання</summary><p>JIT-компілятор створює машинний код під час роботи програми. Сучасні JavaScript-рушії можуть поєднувати інтерпретацію, профілювання та JIT-компіляцію.</p></details><details><summary>Об’єктний файл ще не готова програма</summary><p>Компонувальник (лінкер) об’єднує об’єктні файли й бібліотеки, розв’язуючи посилання між ними. Результат можна завантажити й виконати.</p></details></div><div class="panel"><h2>Знайдіть інструмент для задачі</h2><p>Перетягніть інструмент у відповідну зону. Або натисніть інструмент, а потім зону.</p><div class="tokens">${['Компілятор','Інтерпретатор','Асемблер'].map(t=>`<button class="token" draggable="true" ondragstart="dragToken(event,'${t}')" onclick="chooseToken(this,'${t}')">${t}</button>`).join('')}</div>${[['Асемблер','Перекласти інструкції мови асемблера'],['Компілятор','Перекласти програму в інше подання'],['Інтерпретатор','Виконати програму або її байткод']].map(([a,q])=>`<div class="drop" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();dropToken(this,'${a}')}" ondragover="event.preventDefault()" ondrop="event.preventDefault();dropToken(this,'${a}')" onclick="dropToken(this,'${a}')" data-q="${q}">${q}</div>`).join('')}<div id="matchfeedback" role="status"></div></div>${runnerHTML()}<p class="small muted">Довідка: <a href="https://docs.python.org/3/glossary.html" target="_blank" rel="noopener">Python: байткод та інтерпретатор</a> · <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Introduction" target="_blank" rel="noopener">JavaScript: середовища виконання</a></p>`;showPath('C++');initRunners()}
function showPath(t){const p={'C++':['Код C++ → компіляція → об’єктні файли → компонування → виконання','У типовому нативному інструментарії компіляція включає кілька стадій; асемблер може бути окремою або вбудованою стадією.'],'CPython':['Код Python → компіляція в байткод → виконання інтерпретатором','CPython — поширена реалізація Python. Байткод не є машинним кодом процесора.'],'JavaScript':['Код JavaScript → аналіз → виконання рушієм → можлива JIT-компіляція','Конкретні етапи залежать від рушія. Тут код виконується браузерним рушієм у Web Worker.'],'Асемблер':['Код мовою асемблера → асемблер → об’єктний файл → компонування → виконання','Інструкції та їх кодування залежать від архітектури процесора.']}[t];$('#path').innerHTML=p[0]+'<p class="small" style="font-weight:400">'+p[1]+'</p>'}
let token='';function dragToken(e,t){token=t;e.dataTransfer.setData('text/plain',t)}function chooseToken(el,t){token=t;document.querySelectorAll('.token').forEach(e=>e.classList.remove('chosen'));el.classList.add('chosen')}function dropToken(el,a){if(!token){$('#matchfeedback').textContent='Спочатку виберіть інструмент.';return}if(token===a){el.textContent='✓ '+el.dataset.q+' — '+a;el.style.borderColor='#398460';el.style.background='#f0faf4';$('#matchfeedback').textContent='Правильно!'}else{$('#matchfeedback').textContent='Поки не збігається. Згадайте, що робить цей інструмент.'}}
const codes={py:'name = input("Ваше ім’я: ")\nprint("Привіт,", name)\nprint(2 + 3)',js:'const name = prompt("Ваше ім’я:");\nprint("Привіт,", name);\nconsole.log(2 + 3);',cpp:'#include <iostream>\n#include <string>\nusing namespace std;\nint main() {\n    string name;\n    getline(cin, name);\n    cout << "Привіт, " << name << endl;\n    cout << 2 + 3 << endl;\n    return 0;\n}'};
function runnerHTML(){return `<section><h2>Лабораторія трьох мов</h2><p class="muted">Змініть привітання. Запустіть приклад. Порівняйте синтаксис і результат.</p><div class="runners">${[['py','Python'],['js','JavaScript'],['cpp','C++']].map(([id,n])=>`<article class="runner"><h3>${n}</h3><div class="inside"><label for="code-${id}">Код програми</label><textarea class="code" id="code-${id}" spellcheck="false">${esc(saved['code-'+id]||codes[id])}</textarea>${id!=='cpp'?`<label for="in-${id}">Вхідні дані · кожна відповідь з нового рядка</label><textarea class="stdin" id="in-${id}">Світ</textarea><div class="row"><button class="primary" id="run-${id}" onclick="runCode('${id}')">▶ Запустити</button><button onclick="stopCode('${id}')">■ Стоп</button></div><pre class="output" id="out-${id}" aria-live="polite">Тут з’явиться результат</pre>`:`<p class="small">1. Скопіюйте код.<br>2. Відкрийте Programiz.<br>3. Вставте код, запустіть і введіть ім’я в консолі сервісу.</p><button onclick="copyCpp()">Скопіювати код</button><a class="btn primary" style="margin-top:10px" href="https://www.programiz.com/cpp-programming/online-compiler/" target="_blank" rel="noopener">Відкрити Programiz ↗</a><p id="copy-status" role="status" class="small"></p>`}<button class="small" onclick="resetCode('${id}')">Початковий приклад</button></div></article>`).join('')}</div><p class="small muted">Python потребує завантаження Pyodide з інтернету під час першого запуску. У нашому JavaScript print() — навчальна функція виведення; також працює console.log(). prompt() бере рядки з поля вхідних даних.</p></section>`}
function initRunners(){document.querySelectorAll('.code').forEach(e=>e.addEventListener('input',()=>{saved[e.id]=e.value;persist()}))}function resetCode(id){$('#code-'+id).value=codes[id];saved['code-'+id]=codes[id];persist()}async function copyCpp(){try{await navigator.clipboard.writeText($('#code-cpp').value);$('#copy-status').textContent='✓ Код скопійовано'}catch{$('#code-cpp').select();$('#copy-status').textContent='Натисніть Ctrl+C, щоб скопіювати виділений код.'}}
let workers={},timers={};function stopCode(id){if(workers[id]){workers[id].terminate();delete workers[id];clearTimeout(timers[id]);const b=$('#run-'+id);if(b)b.disabled=false;const out=$('#out-'+id);if(out)out.textContent+='\nВиконання зупинено.'}}
function runCode(id){stopCode(id);const output=$('#out-'+id);output.textContent=id==='py'?'Завантажуємо Python…':'Виконуємо…';$('#run-'+id).disabled=true;const common=`const lines=input.split('\\n');let pos=0;function read(){if(pos>=lines.length)throw new Error('Недостатньо вхідних даних: додайте рядок у поле введення.');return lines[pos++];}function write(...v){postMessage({type:'out',text:v.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')});}`;const source=id==='js'?`onmessage=({data:{code,input}})=>{${common}try{const print=write;const console={log:write,warn:write,error:write};const prompt=()=>read();new Function('print','console','prompt',code)(print,console,prompt);postMessage({type:'done'})}catch(e){postMessage({type:'error',text:e.name+': '+e.message})}}`:`importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let runtime;onmessage=async({data:{code,input}})=>{${common}try{runtime=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});runtime.setStdout({batched:s=>write(s)});runtime.setStderr({batched:s=>write(s)});runtime.setStdin({stdin:()=>read()});postMessage({type:'ready'});await runtime.runPythonAsync(code);postMessage({type:'done'})}catch(e){postMessage({type:'error',text:String(e)})}}`;
const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));const w=new Worker(url);URL.revokeObjectURL(url);workers[id]=w;let started=false;const finish=()=>{clearTimeout(timers[id]);w.terminate();delete workers[id];const b=$('#run-'+id);if(b)b.disabled=false};w.onmessage=({data:d})=>{if(d.type==='ready'){output.textContent='';return}if(d.type==='out'){if(!started){output.textContent='';started=true}output.textContent+=(output.textContent?'\n':'')+d.text}else if(d.type==='error'){output.textContent=d.text;finish()}else if(d.type==='done'){if(!started)output.textContent='Виконано без виведення.';finish()}};w.onerror=e=>{output.textContent='Не вдалося виконати код. '+e.message+' Перевірте інтернет і спробуйте ще раз.';finish()};timers[id]=setTimeout(()=>{stopCode(id);output.textContent+='\nПеревищено час очікування. Для Python перевірте інтернет і повторіть запуск.'},id==='py'?90000:5000);w.postMessage({code:$('#code-'+id).value,input:$('#in-'+id).value})}
const questions=[['Ви компілюєте C++ і отримуєте object-файл. Що зазвичай потрібно далі?',['Компонування з іншими файлами й бібліотеками','Відкрити файл у текстовому редакторі й натиснути print'],0,'Об’єктні файли зазвичай поєднує компонувальник.'],['Python спочатку створює байткод. Чи суперечить це виконанню інтерпретатором?',['Так, компіляція виключає інтерпретацію','Ні, ці етапи можуть поєднуватись'],1,'У CPython байткод виконує інтерпретатор.'],['Учень каже: «JavaScript print залежить від віку мови». Що ви уточните?',['Виведення залежить від середовища та доступних функцій','print завжди є стандартною командою JS для текстового виведення'],0,'У цьому раннері print додано спеціально. У звичайному вікні браузера window.print викликає друк сторінки.'],['Програма використовує класи та цикли. Це суперечність?',['Так, треба обрати лише одну парадигму','Ні, підходи можуть співіснувати'],1,'Багатопарадигмові мови дозволяють поєднувати способи організації коду.'],['Вам потрібен код для іншої архітектури процесора. Який висновок коректний?',['Машинний код завжди універсальний','Нативний код зазвичай потрібно зібрати для цільової архітектури'],1,'Машинні інструкції залежать від архітектури; також важливі ОС і її інтерфейси.']];let quizIndex=0,quizScore=0,quizAnswered=false;function test(){quizIndex=0;quizScore=0;quizQuestion()}function quizQuestion(){quizAnswered=false;const q=questions[quizIndex];$('#content').innerHTML=`<div class="panel"><span class="num">ЗАВДАННЯ ${quizIndex+1} / ${questions.length}</span><h2>Перевірте рішення</h2><h3>${q[0]}</h3><div class="options">${q[1].map((t,i)=>`<button class="qa" onclick="quizAnswer(${i})">${t}</button>`).join('')}</div><div id="q-feedback" role="status"></div><button class="gold hidden" id="q-next" onclick="quizNext()">Далі →</button></div>`}function quizAnswer(i){if(quizAnswered)return;quizAnswered=true;const correct=i===questions[quizIndex][2];if(correct)quizScore++;document.querySelectorAll('.qa').forEach(b=>b.disabled=true);$('#q-feedback').className='feedback '+(correct?'success':'error');$('#q-feedback').textContent=(correct?'✓ Правильно. ':'Правильна відповідь: '+questions[quizIndex][1][questions[quizIndex][2]]+'. ')+questions[quizIndex][3];$('#q-next').classList.remove('hidden')}function quizNext(){if(++quizIndex<questions.length){quizQuestion();return}saved.score=quizScore;persist();$('#content').innerHTML=`<div class="panel"><span class="eyebrow">Результат</span><h2>${quizScore} з ${questions.length}</h2><p>${quizScore===5?'Ви впевнено розрізняєте інструменти та способи виконання коду.':'Перегляньте пояснення й поверніться до складних понять у розділі «Дізнатися більше».'}</p><p class="small muted">Результат збережено лише в цьому браузері.</p><button class="gold" onclick="test()">Спробувати ще раз</button> <button onclick="setTab('more')">До поглиблення</button></div>`}
