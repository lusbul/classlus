<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Turtle Runner</title><style>body{margin:0;background:#ffffff;color:#252144;font:14px system-ui}#drawing{width:640px;height:440px;position:relative;transform-origin:top left;background:#ffffff}#wrap{overflow:hidden}#log{white-space:pre-wrap;padding:10px;max-height:85px;overflow:auto}#state{padding:8px 12px;color:#3530d9}canvas{position:absolute}</style><div id="state">Завантаження Python…</div><div id="wrap"><div id="drawing"></div></div><pre id="log"></pre><script src="assets/skulpt.min.js"></script><script src="assets/skulpt-stdlib.js"></script><script>
function scale(){let s=Math.min(1,innerWidth/640);document.querySelector('#drawing').style.transform='scale('+s+')';document.querySelector('#wrap').style.height=440*s+'px'}onresize=scale;scale();
let busy=false;addEventListener('message',async e=>{if(e.source!==parent||e.data.type!=='run'||busy)return;busy=true;document.querySelector('#log').textContent='';document.querySelector('#state').textContent='Виконується…';try{if(typeof Sk==='undefined')throw Error('Не завантажився Python. Перевірте файли assets або скористайтеся ЄPython.');Sk.TurtleGraphics={target:'drawing',width:640,height:440,animate:false};Sk.configure({output:s=>document.querySelector('#log').textContent+=s,read:f=>{if(Sk.builtinFiles.files[f]===undefined)throw Error('Модуль недоступний: '+f);return Sk.builtinFiles.files[f]},__future__:Sk.python3,execLimit:5000,yieldLimit:50});await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,e.data.code,true));document.querySelector('#state').textContent='Виконано. Перевірте результат на полотні.';let png='';try{let merged=document.createElement('canvas');merged.width=640;merged.height=440;let c=merged.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,640,440);document.querySelectorAll('#drawing canvas').forEach(x=>c.drawImage(x,0,0));png=merged.toDataURL('image/png')}catch{}parent.postMessage({type:'done',png},'*')}catch(err){document.querySelector('#state').textContent='Програму не завершено';document.querySelector('#log').textContent=err.toString();parent.postMessage({type:'error',message:err.toString()},'*')}busy=false});document.querySelector('#state').textContent='Готово до запуску';parent.postMessage({type:'ready'},'*');
</script></html>
